<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แต่งตัวฮีโร่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&display=swap">
<style>
/* Layout: sticker dress-up — painted rooftop stage on top, hero in the middle; picture tabs + sticker trays below. Stickers can be dragged. */
:root{--cream:#fff7ee;--ink:#5b4636;--soft:#9a8574;--berry:#f2768c;--sun:#ffd166;--sky:#7cc0ef;
  --shadow:0 6px 0 rgba(91,70,54,.13);--font:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  background:radial-gradient(40vmax 30vmax at 0% 0%,#ffe3d2,transparent 70%),radial-gradient(40vmax 30vmax at 100% 100%,#e9e0fb,transparent 70%),var(--cream)}
button{font-family:inherit;color:inherit;font-weight:700;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:10px}
.round{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:24px;display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.top h1{flex:1;margin:0;text-align:center;font-size:clamp(22px,6.5vw,30px);color:var(--berry)}
.spk.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(242,118,140,.25),var(--shadow)}}
.stage{position:relative;margin-top:10px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);border:4px solid #fff;flex:none;height:min(48vh,400px);
  background:#ffd9c7 url(img/h-bg.jpg) center/cover}
.heroBox{position:absolute;left:50%;bottom:3%;height:92%;aspect-ratio:600/1110;transform:translateX(-50%);touch-action:none}
.heroBox.fly{animation:fly 1.6s ease-in-out}
@keyframes fly{40%{transform:translate(-50%,-90px) rotate(-5deg)}70%{transform:translate(-50%,-90px) rotate(5deg)}}
.heroBox img{position:absolute;pointer-events:none;-webkit-user-drag:none}
.heroBox .base{inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
.heroBox .stk{transform:translate(-50%,-50%);z-index:3;pointer-events:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.heroBox .stk.cape{z-index:1}
.heroBox .stk.drag{cursor:grabbing;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.name{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 14px;font-size:18px;z-index:5}
.acts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.acts button{width:52px;height:52px;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 4px 0 rgba(91,70,54,.15)}
.tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:3px 12px;font-size:13px;z-index:5;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:#fff;border-radius:20px;padding:6px 12px;box-shadow:0 4px 0 rgba(91,70,54,.12);display:flex;flex-direction:column;align-items:center;font-size:13px;min-width:66px}
.tab .i{font-size:26px;line-height:1.2}
.tab[aria-selected="true"]{background:var(--sun)}
.panel{flex:1;overflow-y:auto;padding:4px 2px calc(16px + env(safe-area-inset-bottom,0px))}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{background:#fff;border-radius:22px;aspect-ratio:1;box-shadow:0 4px 0 rgba(91,70,54,.12);display:grid;place-items:center;padding:8px;font-size:40px}
.opt img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.opt[aria-pressed="true"]{box-shadow:0 0 0 4px var(--berry),0 4px 0 rgba(91,70,54,.12)}
.opt:active,.tab:active,.acts button:active,.round:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="voice.js"></script>
</head><body>
<div class="app">
  <div class="top">
    <a class="round" href="index.html" aria-label="กลับไปหน้ารวมเกม">🏠</a>
    <h1>แต่งตัวฮีโร่</h1>
    <button class="round spk" id="sayName" type="button" aria-label="ฟังชื่อฮีโร่">🔊</button>
  </div>
  <div class="stage" id="stage">
    <span class="name" id="heroName">ฮีโร่ตัวจิ๋ว</span>
    <div class="acts">
      <button type="button" id="rnd" aria-label="สุ่มชุด">🎲</button>
      <button type="button" id="flyBtn" aria-label="ให้ฮีโร่บิน">🚀</button>
    </div>
    <div class="heroBox" id="heroBox"></div>
    <span class="tip">ลากของบนตัวฮีโร่ เลื่อนได้นะ</span>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
const $=id=>document.getElementById(id);
/* item sets: file prefix, count, default spot inside the hero box (x%, y%, width%) */
const SETS=[
 {k:'base',i:'🦸',t:'ฮีโร่',n:6,file:i=>`img/h-base${i+1}.png`,none:false,names:['แมวน้อย','ลูกหมา','กระต่าย','ลูกหมี','แพนด้า','จิ้งจอก']},
 {k:'mask',i:'🎭',t:'หน้ากาก',n:6,file:i=>`img/h-mask${i+1}.png`,none:true,spot:[50,25,58]},
 {k:'cape',i:'🧣',t:'ผ้าคลุม',n:5,file:i=>`img/h-cape${i+1}.png`,none:true,spot:[50,58,150]},
 {k:'emb',i:'⭐',t:'สัญลักษณ์',n:6,file:i=>`img/h-emb${i+1}.png`,none:true,spot:[50,57,26],names:['ดาวเด่น','หัวใจกล้า','พระจันทร์','ใบไม้','สายรุ้ง','อุ้งเท้า']},
 {k:'hat',i:'👑',t:'หมวก',n:4,file:i=>`img/h-hat${i+1}.png`,none:true,spot:[50,5,56]},
 {k:'boots',i:'🥾',t:'รองเท้า',n:3,file:i=>`img/h-boots${i+1}.png`,none:true,spot:[50,95,66]},
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=store.get('hero-state',{base:0,mask:0,cape:0,emb:0,hat:-1,boots:0,pos:{}});
let tab=0;
function heroName(){const e=SETS[3];return 'ฮีโร่'+(S.emb>=0?e.names[S.emb]:SETS[0].names[S.base])}
function render(){
  let h=`<img class="base" src="${SETS[0].file(S.base)}" alt="">`;
  for(const set of SETS.slice(1)){
    const v=S[set.k];if(v<0)continue;
    const p=S.pos[set.k]||set.spot;
    h+=`<img class="stk ${set.k}" data-k="${set.k}" src="${set.file(v)}" alt="" style="left:${p[0]}%;top:${p[1]}%;width:${set.spot[2]}%">`;
  }
  $('heroBox').innerHTML=h;$('heroName').textContent=heroName();store.set('hero-state',S);
}
function renderTabs(){$('tabs').innerHTML=SETS.map((t,i)=>`<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i===tab}"><span class="i">${t.i}</span>${t.t}</button>`).join('')}
function renderPanel(){
  const t=SETS[tab];let h='<div class="opts">';
  if(t.none)h+=`<button class="opt" type="button" data-v="-1" aria-pressed="${S[t.k]===-1}" aria-label="ไม่ใส่">🚫</button>`;
  for(let i=0;i<t.n;i++)h+=`<button class="opt" type="button" data-v="${i}" aria-pressed="${S[t.k]===i}" aria-label="${t.t} แบบที่ ${i+1}"><img src="${t.file(i)}" alt="" loading="lazy"></button>`;
  $('panel').innerHTML=h+'</div>';
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;tab=+b.dataset.i;renderTabs();renderPanel();pop();say('เลือก'+SETS[tab].t+'กันเลย')};
$('panel').onclick=e=>{const o=e.target.closest('.opt');if(!o)return;const t=SETS[tab];S[t.k]=+o.dataset.v;delete S.pos[t.k];render();renderPanel();pop();
  if(t.k==='base')say('ว้าว นี่คือฮีโร่'+t.names[S.base]);else if(t.k==='emb'&&S.emb>=0)say(heroName()+' มาแล้ว');else if(S[t.k]>=0)say('สวยจัง');};
$('rnd').onclick=()=>{for(const t of SETS){S[t.k]=t.none&&Math.random()<.2?-1:Math.floor(Math.random()*t.n)}S.pos={};render();renderPanel();tone([392,523,659],.2);say('ตะแล้น '+heroName()+' แปลงร่างแล้ว')};
$('flyBtn').onclick=()=>{const g=$('heroBox');g.classList.remove('fly');void g.offsetWidth;g.classList.add('fly');tone([330,440,660,880],.18,'triangle');say(heroName()+' บินได้แล้ว ฟิ้ว')};
$('sayName').onclick=()=>say('นี่คือ '+heroName()+' ฮีโร่ของหนูเอง');
/* drag stickers */
let drag=null;
$('heroBox').addEventListener('pointerdown',e=>{const s=e.target.closest('.stk');if(!s)return;e.preventDefault();s.setPointerCapture(e.pointerId);drag={el:s,k:s.dataset.k};s.classList.add('drag')});
$('heroBox').addEventListener('pointermove',e=>{if(!drag)return;const r=$('heroBox').getBoundingClientRect();
  const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
  drag.el.style.left=x+'%';drag.el.style.top=y+'%';const sp=SETS.find(t=>t.k===drag.k).spot;S.pos[drag.k]=[x,y,sp[2]]});
const end=()=>{if(!drag)return;drag.el.classList.remove('drag');drag=null;store.set('hero-state',S);pop()};
$('heroBox').addEventListener('pointerup',end);$('heroBox').addEventListener('pointercancel',end);
/* sound + voice */
let ac;function tone(fs,d,type){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.08;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)})}catch(e){}}
const pop=()=>tone([660],.12,'triangle');
function say(t){try{Voice.say(t)}catch(e){}}
Voice.onstart=()=>$('sayName').classList.add('on');Voice.onend=()=>$('sayName').classList.remove('on');
render();renderTabs();renderPanel();
</script>
</body></html>
