<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>ฮีโร่ใยแมงมุม ช่วยเมือง</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Thonburi',sans-serif;background:linear-gradient(#9de5ff,#f5fcff);color:#17304c;text-align:center;touch-action:manipulation}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(26px,6vw,42px);margin:8px}p{font-size:22px}.scene{background:#fff;border:5px solid #2775d0;border-radius:30px;min-height:340px;padding:20px;margin:14px 0;box-shadow:0 9px 0 #c0d9ef}.hero{font-size:78px}.items{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;margin:20px auto}.btn{border:0;border-radius:22px;background:#ffdf49;box-shadow:0 7px 0 #d5a627;padding:18px 24px;font-size:clamp(23px,5vw,32px);font-weight:800;color:#17304c;min-width:105px;min-height:78px;cursor:pointer}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #d5a627}.secondary{background:#d5f0ff;box-shadow:0 7px 0 #8fb6cf}.good{background:#b8f1a0;box-shadow:0 7px 0 #65b65c}.status{font-size:24px;font-weight:700;min-height:34px}.skyline{font-size:52px;letter-spacing:8px}.small{font-size:18px}.progress{font-size:22px;font-weight:700}.web{font-size:55px}button:focus-visible{outline:5px solid #e43d4a}@media(max-width:500px){.scene{min-height:350px;padding:12px}.btn{padding:14px;min-width:90px}.skyline{font-size:38px;letter-spacing:1px}}</style></head><body><main><a href="index.html" style="display:inline-block;margin:4px 0;padding:10px 18px;border-radius:999px;background:#fff;color:#17304c;font-size:20px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 #c0d9ef">‹ เกมทั้งหมด</a><h1>🕷️ ฮีโร่ใยแมงมุม</h1><div class="progress" id="progress">ภารกิจช่วยเมือง • 5 ด่าน</div><div class="scene" id="scene"></div><div class="status" id="status" aria-live="polite"></div><div class="items" id="actions"></div><div class="items"><button class="btn secondary" onclick="speak(instruction)">🔊 ฟังอีกครั้ง</button><button class="btn secondary" onclick="restart()">🏠 เริ่มใหม่</button></div><p class="small">เกมสำหรับเด็กเล็ก • ไม่มีโฆษณา • ไม่ต้องใช้อินเทอร์เน็ต</p></main><script>let level=0,step=0,instruction='',done=false;const scene=document.getElementById('scene'),actions=document.getElementById('actions'),status=document.getElementById('status'),progress=document.getElementById('progress');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=.83;u.pitch=1.12;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('th'));if(v)u.voice=v;speechSynthesis.speak(u)}function button(label,fn,cls=''){let b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=fn;actions.appendChild(b)}function show(t,html){instruction=t;scene.innerHTML=html;actions.innerHTML='';status.textContent='';progress.textContent=`ด่าน ${level+1} / 5 ⭐`;setTimeout(()=>speak(t),250)}function success(msg){if(done)return;done=true;status.textContent='🌟 '+msg;speak('เก่งมาก! '+msg);actions.innerHTML='';button(level===4?'🎉 รับเหรียญฮีโร่':'➡️ ด่านต่อไป',()=>{level++;step=0;done=false;render()},'good')}function wrong(){status.textContent='ลองอีกครั้งนะ 💛';speak('ลองอีกครั้งนะ')}function render(){if(level===5){progress.textContent='ภารกิจสำเร็จ!';scene.innerHTML='<div class="hero">🏅🕷️🏙️</div><h1>สุดยอดฮีโร่!</h1><p>ช่วยเมืองครบทั้ง 5 ด่านแล้ว</p><div class="skyline">🎈🌈🎉</div>';actions.innerHTML='';status.textContent='';speak('เยี่ยมมาก! หนูช่วยเมืองสำเร็จแล้ว');button('🔁 เล่นอีกครั้ง',restart,'good');return}if(level===0){show('ลูกแมวอยู่บนหลังคา แตะใยแมงมุมเพื่อช่วยลูกแมว',`<div class="hero">🕷️</div><div class="skyline">🏢 🐱 🏠</div><p>ช่วยลูกแมวลงจากหลังคา!</p>`);button('🕸️ ยิงใยช่วยแมว',()=>{scene.innerHTML='<div class="hero">🕷️🕸️🐱</div><p>ลูกแมวปลอดภัยแล้ว!</p>';success('ช่วยลูกแมวสำเร็จ')})}if(level===1){show('ช่วยต่อสะพาน เลือกบล็อกสี่เหลี่ยมให้ครบสามชิ้น',`<div class="hero">🌉</div><p>ต่อบล็อกสี่เหลี่ยม 3 ชิ้น</p><div id="blocks" class="skyline">⬜ ⬜ ⬜</div>`);step=0;button('🟦 สี่เหลี่ยม',()=>{step++;document.getElementById('blocks').textContent='🟦 '.repeat(step)+'⬜ '.repeat(3-step);if(step===3)success('สร้างสะพานสำเร็จ')});button('🔴 วงกลม',wrong,'secondary');button('🔺 สามเหลี่ยม',wrong,'secondary')}if(level===2){show('เลือกทางที่ปลอดภัยให้ฮีโร่เดินไปช่วยเพื่อน',`<div class="hero">🕷️</div><div class="skyline">🌳 🛣️ 🌊</div><p>ทางไหนปลอดภัย?</p>`);button('🌳 ทางสวน',()=>success('เลือกทางปลอดภัยสำเร็จ'));button('🌊 ทางน้ำ',wrong,'secondary');button('🔥 ทางไฟ',wrong,'secondary')}if(level===3){show('นับดาวให้ดี มีดาวกี่ดวง',`<div class="hero">🕷️</div><div class="skyline">⭐ ⭐ ⭐ ⭐</div><p>มีดาวกี่ดวง?</p>`);[3,4,5].forEach(n=>button(''+n,()=>n===4?success('นับดาวถูกต้อง'):wrong()))}if(level===4){show('จับคู่รูปทรง เลือกรูปดาวให้ตรงกับประตู',`<div class="hero">🚪⭐</div><p>ประตูต้องการรูปดาว</p>`);button('❤️ หัวใจ',wrong,'secondary');button('⭐ ดาว',()=>success('เปิดประตูช่วยเพื่อนสำเร็จ'));button('🔵 วงกลม',wrong,'secondary')}}function restart(){level=0;step=0;done=false;render()}render();</script></body></html>
